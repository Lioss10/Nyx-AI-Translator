<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Subtitle parse and rebuild example</title>
  <desc id="desc">Dark diagram showing an ASS subtitle line split into structure and clean text, translated, then rebuilt with original timing and style.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0 L0 0 0 36" fill="none" stroke="#30363d" stroke-width="0.55" opacity="0.55"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.36"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#58a6ff"/></marker>
    <style>
      .title{font:800 40px Inter,Segoe UI,Arial,sans-serif;fill:#f0f6fc}.sub{font:500 18px Inter,Segoe UI,Arial,sans-serif;fill:#8b949e}.card{fill:#161b22;stroke:#30363d;stroke-width:2;rx:24;filter:url(#shadow)}.original{stroke:#58a6ff}.clean{stroke:#3fb950}.translated{stroke:#d29922}.rebuilt{stroke:#a371f7}.h{font:800 23px Inter,Segoe UI,Arial,sans-serif;fill:#f0f6fc}.p{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#c9d1d9}.code{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#f0f6fc}.smallcode{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace}.muted{fill:#8b949e}.blue{fill:#79c0ff}.green{fill:#7ee787}.amber{fill:#ffa657}.purple{fill:#d2a8ff}.red{fill:#ff7b72}.arrow{stroke:#58a6ff;stroke-width:4;fill:none;marker-end:url(#arrow);stroke-linecap:round}.label{font:800 13px Inter,Segoe UI,Arial,sans-serif;fill:#f0f6fc}.chipBlue{fill:#1f6feb}.chipGreen{fill:#238636}.chipAmber{fill:#9e6a03}.chipPurple{fill:#8957e5}.boxbg{fill:#0d1117;stroke:#30363d;stroke-width:1.4;rx:12}.caption{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#c9d1d9}.legend{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#8b949e}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect width="1400" height="900" fill="url(#grid)"/>
  <circle cx="1170" cy="110" r="145" fill="#1f6feb" opacity="0.12"/>
  <circle cx="120" cy="815" r="170" fill="#238636" opacity="0.10"/>
  <text x="70" y="70" class="title">Structure-Preserving Translation</text>
  <text x="70" y="104" class="sub">Nyx extracts only dialogue text, protects style tags, translates, then restores everything into the same subtitle line.</text>

  <g transform="translate(70,145)">
    <rect class="card original" width="1260" height="160" rx="24"/>
    <rect x="30" y="24" width="86" height="26" rx="13" class="chipBlue"/><text x="47" y="42" class="label">ORIGINAL</text>
    <text x="132" y="43" class="h">ASS subtitle line</text>
    <rect x="30" y="68" width="1200" height="58" rx="12" class="boxbg"/>
    <text x="50" y="103" class="smallcode muted">Dialogue: 0,</text>
    <text x="160" y="103" class="smallcode blue">0:00:01.00,0:00:03.00</text>
    <text x="360" y="103" class="smallcode muted">,Default,,0,0,0,,</text>
    <text x="535" y="103" class="smallcode purple">{\an8}</text>
    <text x="600" y="103" class="smallcode red">Hello, </text>
    <text x="675" y="103" class="smallcode purple">{\i1}</text>
    <text x="730" y="103" class="smallcode red">friend</text>
    <text x="790" y="103" class="smallcode purple">{\i0}</text>
    <text x="845" y="103" class="smallcode red">!</text>
    <text x="50" y="142" class="legend">Blue = timing · Purple = ASS tags/style markers · Red = dialogue text</text>
  </g>

  <!-- Original ASS subtitle line points to the Extract/Clean Text step. Final segment is vertical so arrowhead lands on the box edge. -->
  <path class="arrow" d="M700 310 L700 342 L365 342 L365 383"/>

  <g transform="translate(70,385)">
    <rect class="card clean" width="590" height="180" rx="24"/>
    <rect x="30" y="24" width="105" height="26" rx="13" class="chipGreen"/><text x="49" y="42" class="label">EXTRACT</text>
    <text x="150" y="43" class="h">Clean text sent to provider</text>
    <rect x="30" y="72" width="530" height="58" rx="12" class="boxbg"/>
    <text x="50" y="108" class="code red">Hello, </text>
    <text x="126" y="108" class="code purple">&lt;TAG_2&gt;</text>
    <text x="222" y="108" class="code red">friend</text>
    <text x="292" y="108" class="code purple">&lt;TAG_3&gt;</text>
    <text x="388" y="108" class="code red">!</text>
    <text x="30" y="154" class="p">No timestamps. No style definitions. No full subtitle file.</text>
  </g>

  <path class="arrow" d="M663 475 L735 475"/>

  <g transform="translate(740,385)">
    <rect class="card translated" width="590" height="180" rx="24"/>
    <rect x="30" y="24" width="120" height="26" rx="13" class="chipAmber"/><text x="49" y="42" class="label">TRANSLATE</text>
    <text x="165" y="43" class="h">Provider returns translated text</text>
    <rect x="30" y="72" width="530" height="58" rx="12" class="boxbg"/>
    <text x="50" y="108" class="code red">مرحباً، </text>
    <text x="142" y="108" class="code purple">&lt;TAG_2&gt;</text>
    <text x="238" y="108" class="code red">صديقي</text>
    <text x="315" y="108" class="code purple">&lt;TAG_3&gt;</text>
    <text x="410" y="108" class="code red">!</text>
    <text x="30" y="154" class="p">Placeholders stay exactly where style tags belong.</text>
  </g>

  <path class="arrow" d="M1035 567 L1035 610 L700 610 L700 663"/>

  <g transform="translate(70,665)">
    <rect class="card rebuilt" width="1260" height="170" rx="24"/>
    <rect x="30" y="24" width="92" height="26" rx="13" class="chipPurple"/><text x="48" y="42" class="label">REBUILD</text>
    <text x="138" y="43" class="h">Translated text restored into the original subtitle shell</text>
    <rect x="30" y="72" width="1200" height="58" rx="12" class="boxbg"/>
    <text x="50" y="108" class="smallcode muted">Dialogue: 0,</text>
    <text x="160" y="108" class="smallcode blue">0:00:01.00,0:00:03.00</text>
    <text x="360" y="108" class="smallcode muted">,Default,,0,0,0,,</text>
    <text x="535" y="108" class="smallcode purple">{\an8}</text>
    <text x="600" y="108" class="smallcode red">مرحباً، </text>
    <text x="690" y="108" class="smallcode purple">{\i1}</text>
    <text x="745" y="108" class="smallcode red">صديقي</text>
    <text x="815" y="108" class="smallcode purple">{\i0}</text>
    <text x="870" y="108" class="smallcode red">!</text>
    <text x="50" y="150" class="caption">Same timing + same style + same tags + translated dialogue in the correct place.</text>
  </g>
</svg>